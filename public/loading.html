<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Foreman</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #f7f7f5;
      color: #242424;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      app-region: drag;
      -webkit-app-region: drag;
    }
    main { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    img { width: 112px; height: 112px; object-fit: contain; animation: arrive 1.5s ease-in-out infinite alternate; }
    strong { font-size: 20px; font-weight: 500; }
    .progress { width: 84px; height: 2px; overflow: hidden; background: #e2e2df; }
    .progress::after { display: block; width: 50%; height: 100%; background: #e3a928; content: ""; animation: load 1.1s ease-in-out infinite; }
    @keyframes arrive { from { transform: translateY(2px) scale(.97); opacity: .82; } to { transform: translateY(-2px) scale(1); opacity: 1; } }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(200%); } }
    @media (prefers-color-scheme: dark) {
      body { background: #191919; color: #f2f2f2; }
      .progress { background: #373737; }
    }
    @media (prefers-reduced-motion: reduce) { img, .progress::after { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img src="../icons/Foreman.png" alt="" />
    <strong>Open Foreman</strong>
    <span class="progress"></span>
  </main>
</body>
</html>
